name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect available Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | grep -E 'platforms;android-|build-tools;' | tail -40
      - name: Install Android SDK platform and build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Run local unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run emulator launch smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coolanas-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="android-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Coolanas Android build ${{ github.run_number }}" \
            --notes "Debug APK built from commit $GITHUB_SHA."

      - name: Run local unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run emulator launch smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
